<style>

:root[data-theme="dark"]{--bg:#0f1318;--card:#181e26;--tx:#eef1f5;--mut:#98a2b3;--ln:#2a323d;--ac:#3ecf8e;--acx:#06210f;--hl:#16302a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:12px}
h1{font-size:20px;margin:4px 0 12px}
h2{font-size:15px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:12px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
.tab{flex:none;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:999px;padding:8px 14px;font-size:14px}
.tab.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
button{font:inherit;cursor:pointer}
.btn{background:var(--ac);color:var(--acx);border:0;border-radius:8px;padding:10px 14px;font-weight:600}
.btn.gh{background:transparent;color:var(--mut);border:1px solid var(--ln);font-weight:400}
.btn.dg{background:transparent;color:var(--rd);border:1px solid var(--rd);font-weight:400}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:9px;min-width:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>input[type=text]{flex:1}
.sc{width:54px;text-align:center}
.cc{width:46px;text-align:center}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;white-space:nowrap}
th,td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--ln)}
th{color:var(--mut);font-weight:600;font-size:12px}
td.n{text-align:left;font-weight:600}
td.p{font-weight:700}
tr.q td{background:var(--hl)}
.y{display:inline-block;width:10px;height:14px;border-radius:2px;background:var(--yl);vertical-align:middle}
.r{display:inline-block;width:10px;height:14px;border-radius:2px;background:var(--rd);vertical-align:middle}
.m{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid var(--ln)}
.m small{color:var(--mut)}
.x{border:0;background:transparent;color:var(--rd);font-size:18px;padding:4px 8px}
.mut{color:var(--mut);font-size:13px}
.lbl{font-size:12px;color:var(--mut);margin:8px 0 4px}
#live{display:contents}
.ic{padding:8px 11px;font-size:18px;line-height:1}
.vw .ed,.vw .x,.vw [onclick="addG()"]{display:none}
.vw input{pointer-events:none;border-color:transparent;background:transparent}
.ib{background:transparent;color:var(--mut);border:1px solid var(--ln);border-radius:999px;padding:2px 10px;font-size:12px}
.stk{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;box-shadow:0 6px 14px rgba(0,0,0,.15);padding:8px 10px}
.stk h2{margin:0 0 4px;font-size:14px}
.stk th,.stk td{padding:5px 4px}
</style></head><body>

var CATS=[["s9","Sub 9"],["s11","Sub 11"]];

var A=mk("Chave A",["AVF","SER Santiago","RG Futsal","Cruzeiro"]),B=mk("Chave B",["Futsal Brasil","CE Real","AERSVS","Futsal Evolução"]);

(function(){var d=S.D.s9;var empty=!d.groups.length||(d.groups.length===1&&!d.groups[0].teams.length&&!d.groups[0].matches.length);

function id(){return Math.random().toString(36).slice(2,9)}

  var rows=calc(g);

function done(g){var c=0,seen={};g.matches.forEach(function(m){if(m.ga===""||m.gb==="")return;var k=[m.a,m.b].sort().join("|");if(!seen[k]){seen[k]=1;c++}});var t=g.teams.length;return t>1&&c>=t*(t-1)/2}
function kget(key,pr){var k=S.ko[key];return k&&pr&&k.a===pr[0].id&&k.b===pr[1].id?k:null}
function win(key,pr){var k=kget(key,pr);if(!k||k.ga===""||k.gb==="")return null;if(k.ga>k.gb)return pr[0];if(k.gb>k.ga)return pr[1];if(k.pa===""||k.pb===""||k.pa===k.pb)return null;return k.pa>k.pb?pr[0]:pr[1]}
function koTeams(){var A=S.groups[0],B=S.groups[1],o={s1:null,s2:null,f:null,pv:null};if(!A||!B)return o;var ra=(A.matches.length||dm(A).length)?calc(A):[],rb=(B.matches.length||dm(B).length)?calc(B):[];o.pv={s1:[ra[0]||null,rb[1]||null],s2:[rb[0]||null,ra[1]||null]};if(!done(A)||!done(B))return o;o.s1=[ra[0],rb[1]];o.s2=[rb[0],ra[1]];var w1=win("s1",o.s1),w2=win("s2",o.s2);if(w1&&w2)o.f=[w1,w2];return o}
